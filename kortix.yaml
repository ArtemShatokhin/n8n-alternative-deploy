# yaml-language-server: $schema=https://kortix.com/schema/kortix.v2.schema.json
#
# A minimal, valid Kortix v2 manifest. It declares one agent and the two
# trigger types the platform supports: cron and webhook. Behavior lives in
# agents/ops-agent.md; this file sets governance only.
kortix_version: 2
default_agent: ops-agent

project:
  name: n8n-alternative-deploy
  description: A company agent platform on Kortix, the open-source n8n alternative.

env:
  required: []
  optional: [TAVILY_API_KEY]

agents:
  ops-agent:
    file: agents/ops-agent.md
    connectors: all
    secrets: all

triggers:
  - slug: morning-digest
    name: Morning operations digest
    type: cron
    agent: ops-agent
    cron: '0 8 * * 1-5'
    prompt: |
      Summarize yesterday's operations work into a short digest.
      Write it to reports/digest.md and open a change request against main.

  - slug: task-webhook
    name: On-demand task run
    type: webhook
    agent: ops-agent
    prompt: |
      Run the task described in the webhook payload and open a change
      request with the finished work.
